name: atom
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.11+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  lottie: ^3.3.1
  mapbox_maps_flutter: ^2.20.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  loading_animation_widget: ^1.3.0
  fl_chart: ^0.69.0
  image: ^4.5.4
  image_picker: ^1.2.0
  camera: ^0.11.2
  device_info_plus: ^12.1.0
  animated_splash_screen: ^1.3.0
  local_auth: ^2.3.0
  mqtt_client: ^10.11.1
  location: ^8.0.1
  geolocator: ^14.0.2
  flutter_map_location_marker: ^10.1.0
  flutter_file_downloader: ^2.1.0
  open_file: ^3.5.10
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_bluetooth_classic_serial: ^1.3.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  in_app_update: ^4.2.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/orca_icon_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/orca_icon_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#141720"
  image: "assets/orca_logo1.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
